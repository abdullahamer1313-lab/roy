<style>
*{box-sizing:border-box}
body{
  margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
  padding:24px; color:#eef6ff; font-family:Arial,sans-serif;
  background:radial-gradient(circle at 20% 15%,#164b9c 0,transparent 34%),
             radial-gradient(circle at 85% 80%,#092c67 0,transparent 38%),#050b18;
}
.card{
  width:min(100%,420px); padding:30px 24px; text-align:center; border-radius:28px;
  background:rgba(8,22,48,.88); border:1px solid rgba(82,171,255,.45);
  box-shadow:0 0 35px rgba(0,140,255,.22), inset 0 0 25px rgba(0,120,255,.08);
}
.avatar{
  width:148px;height:148px;object-fit:cover;border-radius:50%;
  border:3px solid #55c8ff;box-shadow:0 0 24px #168bff;margin-bottom:15px;
}
h1{font-size:38px;letter-spacing:7px;margin:8px 0;color:#80d9ff;text-shadow:0 0 18px #168bff}
.sub{color:#a9c9ed;margin:0 0 22px}
.links{display:grid;gap:12px;margin:22px 0}
.links a{
  display:block;text-decoration:none;color:#eaf7ff;padding:14px;border-radius:14px;
  border:1px solid #258be0;background:linear-gradient(110deg,rgba(15,65,125,.8),rgba(8,27,58,.9));
  box-shadow:0 0 13px rgba(25,142,255,.12);font-weight:bold
}
.links a:active{transform:scale(.98)}
.music{margin-top:22px;text-align:right}
.music h2{font-size:17px;color:#8edcff;margin-bottom:10px}
iframe{width:100%;height:190px;border:0;border-radius:14px}
footer{color:#7196bd;font-size:12px;margin-top:22px}
</style>
